<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e100f" />
    <meta name="description" content="Control your slides with hand gestures, or turn your phone into a clicker and laser pointer." />

    <!-- Tab and home-screen icons. Re-render the PNGs with tools/brand/render.sh. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (WhatsApp, Slack, X, LinkedIn…). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ppt-remote" />
    <meta property="og:title" content="ppt-remote · present with your phone as a laser" />
    <meta property="og:description" content="Control your slides with hand gestures, or turn your phone into a clicker and laser pointer. Nothing to install." />
    <meta property="og:url" content="https://ppt-remote.onrender.com/" />
    <meta property="og:image" content="https://ppt-remote.onrender.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ppt-remote: present with your phone as a laser pointer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ppt-remote · present with your phone as a laser" />
    <meta name="twitter:description" content="Control your slides with hand gestures, or turn your phone into a clicker and laser pointer." />
    <meta name="twitter:image" content="https://ppt-remote.onrender.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>ppt-remote</title>
    <style>
      /* Loading screen. Inline so it paints before any JS or CSS bundle loads;
         src/ui/splash.ts fades it out once the first route has rendered.
         Values are copied from the tokens in src/styles.css. */
      html, body { margin: 0; background: #0e100f; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #0e100f;
        color: #fffce1;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-inner { display: grid; justify-items: center; gap: 22px; }
      .splash-mark {
        position: relative;
        display: inline-flex;
        font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: clamp(2.4rem, 9vw, 4.2rem);
        letter-spacing: -0.04em;
        line-height: 1;
        transform: skewX(-9deg);
      }
      .splash-mark > span {
        display: inline-block;
        opacity: 0;
        animation: splash-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: calc(0.08s + var(--i) * 0.045s);
      }
      .splash-dot {
        position: absolute;
        right: -0.3em;
        top: 0.12em;
        width: 0.2em;
        height: 0.2em;
        border-radius: 50%;
        background: #ff3b3b;
        box-shadow: 0 0 16px 3px rgba(255, 59, 59, 0.8);
        opacity: 0;
        animation: splash-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards,
          splash-blink 2.4s ease-in-out 1.1s infinite;
      }
      .splash-bar {
        position: relative;
        width: clamp(120px, 30vw, 180px);
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(255, 252, 225, 0.1);
      }
      .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(100deg, #0ae448 0%, #abff84 45%, #fec5fb 100%);
        animation: splash-sweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(0.45em); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-blink {
        50% { opacity: 0.4; transform: scale(0.7); }
      }
      @keyframes splash-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(230%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark > span, .splash-dot { animation: none; opacity: 1; }
        .splash-bar::after { animation: none; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-mark"><span style="--i:0">p</span><span style="--i:1">p</span><span style="--i:2">t</span><span style="--i:3">-</span><span style="--i:4">r</span><span style="--i:5">e</span><span style="--i:6">m</span><span style="--i:7">o</span><span style="--i:8">t</span><span style="--i:9">e</span><i class="splash-dot"></i></div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
