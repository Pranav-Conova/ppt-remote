<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ppt-remote mark: the splash screen's slanted cream "p" with its red
       laser dot, on the ink tile. Colours come from src/styles.css. -->
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.75" />
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e100f" />
  <g transform="translate(3 0) skewX(-9)">
    <rect x="18" y="17" width="9" height="38" rx="2.5" fill="#fffce1" />
    <circle cx="33" cy="30.5" r="9" fill="none" stroke="#fffce1" stroke-width="9" />
  </g>
  <circle cx="51" cy="13" r="10" fill="url(#glow)" />
  <circle cx="51" cy="13" r="5" fill="#ff3b3b" />
</svg>
