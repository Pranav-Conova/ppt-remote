# Render Blueprint: New > Blueprint, pick this repo, branch v2.
services:
  - type: web
    name: signify
    runtime: docker
    plan: free
    branch: v2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Optional overrides (see .env.example). Leave unset to use defaults.
      - key: PUBLIC_URL
        sync: false
      - key: ICE_SERVERS
        sync: false
