<!doctype html>
<!-- Source for frontend/public/og-image.png, the link-preview image shown by
     WhatsApp, Slack, X and friends. Re-render with tools/brand/render.sh.
     Colours, type and shapes copy src/styles.css, home.css and ui/art.tsx. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Space+Grotesk:wght@600;700&display=block" rel="stylesheet" />
<style>
  :root {
    --ink: #0e100f; --ink-2: #161817; --cream: #fffce1; --muted: #b5b29f;
    --c-green: #0ae448; --c-pink: #fec5fb; --c-lime: #abff84; --laser: #ff3b3b;
    --line: rgba(255, 252, 225, 0.1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  body {
    position: relative;
    font-family: "Space Grotesk", system-ui, sans-serif;
    color: var(--cream);
    /* Faint grid, like a slide canvas. */
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
  }
  body::after {
    /* Fade the grid out towards the copy. */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 90% at 22% 55%, var(--ink) 35%, transparent 100%);
  }
  .copy { position: absolute; z-index: 2; left: 72px; top: 64px; width: 720px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); }
  .brand span { font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  h1 {
    margin-top: 44px;
    display: grid; gap: 6px;
    font-size: 88px; font-weight: 700; line-height: 1.02; letter-spacing: -0.045em;
  }
  .line { white-space: nowrap; }
  .sticker {
    --s: var(--c-green);
    display: inline-block; padding: 0 0.16em 0.06em; border-radius: 0.12em;
    color: var(--ink); background: var(--s);
    box-shadow: -0.07em 0.09em 0 color-mix(in srgb, var(--s) 40%, #000);
    rotate: -2.5deg;
  }
  .s-pink { --s: var(--c-pink); rotate: 1.5deg; margin-left: 0.04em; }
  .url {
    position: absolute; z-index: 2; left: 72px; bottom: 50px;
    font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 22px; color: var(--muted);
    display: flex; align-items: center; gap: 12px;
  }
  .url i { width: 10px; height: 10px; border-radius: 50%; background: var(--c-green); box-shadow: 0 0 12px var(--c-green); }

  /* Right: a phone pointing a laser at a slide, with the home page's shapes. */
  .art { position: absolute; z-index: 1; inset: 0; }
  .shape { position: absolute; }
  .clover { width: 150px; right: 64px; top: 34px; rotate: 12deg; }
  .ring { width: 120px; right: 360px; bottom: 30px; }
  .asterisk { width: 96px; right: 40px; bottom: 150px; rotate: 10deg; }
  .squiggle { width: 150px; right: 300px; top: 30px; rotate: -8deg; }
  .slide {
    position: absolute; right: 120px; top: 170px; width: 300px; height: 190px;
    border-radius: 14px; background: var(--ink-2);
    border: 3px solid var(--cream); box-shadow: 10px 10px 0 var(--c-lime);
    rotate: 3deg; padding: 24px;
  }
  .slide b { display: block; height: 16px; border-radius: 8px; background: rgba(255, 252, 225, 0.85); width: 70%; }
  .slide b + b { margin-top: 14px; height: 10px; background: rgba(255, 252, 225, 0.3); width: 88%; }
  .slide b + b + b { width: 60%; }
  .slide .bars { display: flex; align-items: flex-end; gap: 12px; height: 62px; margin-top: 18px; }
  .slide .bars s { width: 34px; border-radius: 5px 5px 0 0; background: var(--c-green); }
  .slide .bars s:nth-child(2) { background: var(--c-pink); }
  .slide .bars s:nth-child(3) { background: var(--c-lime); }
  .dot {
    position: absolute; right: 166px; top: 214px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--laser); box-shadow: 0 0 22px 7px rgba(255, 59, 59, 0.8);
  }
  .beam { position: absolute; inset: 0; }
  .phone {
    position: absolute; right: 250px; bottom: 34px; width: 112px; height: 210px;
    border-radius: 24px; background: var(--ink-2); border: 3px solid var(--cream);
    box-shadow: -8px 8px 0 var(--c-pink); rotate: -14deg;
    display: grid; place-items: center;
  }
  .phone::before {
    content: ""; position: absolute; top: 9px; left: 50%; translate: -50% 0;
    width: 30px; height: 6px; border-radius: 3px; background: rgba(255, 252, 225, 0.3);
  }
  .phone .btn {
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--laser); box-shadow: 0 0 18px 2px rgba(255, 59, 59, 0.6), inset 0 -4px 0 rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body>
  <div class="art" aria-hidden="true">
    <svg class="shape clover" viewBox="0 0 100 100">
      <defs><linearGradient id="gc" gradientTransform="rotate(70 .5 .5)"><stop offset="0" stop-color="#fff0fd" /><stop offset="1" stop-color="#f472d0" /></linearGradient></defs>
      <g fill="url(#gc)"><circle cx="29" cy="29" r="25" /><circle cx="71" cy="29" r="25" /><circle cx="29" cy="71" r="25" /><circle cx="71" cy="71" r="25" /></g>
    </svg>
    <svg class="shape ring" viewBox="0 0 100 100">
      <defs><linearGradient id="gr" gradientTransform="rotate(110 .5 .5)"><stop offset="0" stop-color="#00bae2" /><stop offset="1" stop-color="#fec5fb" /></linearGradient></defs>
      <circle cx="50" cy="50" r="36" fill="none" stroke="url(#gr)" stroke-width="20" />
    </svg>
    <svg class="shape asterisk" viewBox="0 0 100 100">
      <defs><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="90" y2="90"><stop offset="0" stop-color="#ff8709" /><stop offset="1" stop-color="#ffd9c2" /></linearGradient></defs>
      <g stroke="url(#ga)" stroke-width="13" stroke-linecap="round">
        <line x1="50" y1="8" x2="50" y2="92" /><line x1="50" y1="8" x2="50" y2="92" transform="rotate(45 50 50)" />
        <line x1="50" y1="8" x2="50" y2="92" transform="rotate(90 50 50)" /><line x1="50" y1="8" x2="50" y2="92" transform="rotate(135 50 50)" />
      </g>
    </svg>
    <svg class="shape squiggle" viewBox="0 0 120 80">
      <defs><linearGradient id="gs"><stop offset="0" stop-color="#9d95ff" /><stop offset="1" stop-color="#f472d0" /></linearGradient></defs>
      <path d="M8 60 C 20 20, 34 20, 40 44 S 62 70, 70 40 S 92 8, 112 22" fill="none" stroke="url(#gs)" stroke-width="14" stroke-linecap="round" />
    </svg>

    <div class="slide"><b></b><b></b><b></b><div class="bars"><s style="height:40%"></s><s style="height:75%"></s><s style="height:100%"></s></div></div>
    <svg class="beam" viewBox="0 0 1200 630">
      <defs><linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="905" y1="430" x2="1023" y2="225"><stop offset="0" stop-color="#ff3b3b" stop-opacity="0" /><stop offset="1" stop-color="#ff3b3b" stop-opacity="0.9" /></linearGradient></defs>
      <line x1="905" y1="430" x2="1023" y2="225" stroke="url(#gb)" stroke-width="4" stroke-linecap="round" />
    </svg>
    <div class="dot"></div>
    <div class="phone"><div class="btn"></div></div>
  </div>

  <div class="copy">
    <div class="brand"><img src="../../frontend/public/favicon.svg" alt="" /><span>ppt-remote</span></div>
    <h1>
      <span class="line">Present with</span>
      <span class="line"><span class="sticker">your phone</span></span>
      <span class="line"><span class="sticker s-pink">as a laser</span></span>
    </h1>
  </div>
  <p class="url"><i></i>ppt-remote.onrender.com · nothing to install</p>
</body>
</html>
